<style>
  html, body { margin: 0; padding: 0; background: #05070d; }
  body {
    -webkit-font-smoothing: antialiased;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'><circle cx='11' cy='11' r='9' fill='none' stroke='%23aebfe8' stroke-width='1.2'/><ellipse cx='11' cy='11' rx='4' ry='9' fill='none' stroke='%23aebfe8' stroke-width='0.8'/><path d='M2.6 8 h16.8 M2.6 14 h16.8' stroke='%23aebfe8' stroke-width='0.8' fill='none'/></svg>") 11 11, auto;
  }
  a, button, [role="button"] {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'><circle cx='11' cy='11' r='9' fill='none' stroke='%238fb0ff' stroke-width='1.4'/><ellipse cx='11' cy='11' rx='4' ry='9' fill='none' stroke='%238fb0ff' stroke-width='0.9'/><path d='M2.6 8 h16.8 M2.6 14 h16.8' stroke='%238fb0ff' stroke-width='0.9' fill='none'/></svg>") 11 11, pointer;
  }
  ::selection { background: rgba(143,176,255,0.28); }
  a { color: #e9edf7; }
  a:hover { color: #8fb0ff; }
  @keyframes ambientA { 0% { transform: translate(-12vw,-8vh) scale(1); opacity: 0.14; } 25% { transform: translate(6vw,14vh) scale(1.2); opacity: 0.21; } 50% { transform: translate(16vw,-4vh) scale(1.3); opacity: 0.17; } 75% { transform: translate(-4vw,10vh) scale(1.1); opacity: 0.22; } 100% { transform: translate(-12vw,-8vh) scale(1); opacity: 0.14; } }
  @keyframes ambientC { 0% { transform: translate(-6vw,6vh) scale(1); opacity: 0.12; } 33% { transform: translate(8vw,-10vh) scale(1.18); opacity: 0.19; } 66% { transform: translate(-12vw,-2vh) scale(0.9); opacity: 0.11; } 100% { transform: translate(-6vw,6vh) scale(1); opacity: 0.12; } }
  @keyframes grainShift { 0% { transform: translate(0,0); } 33% { transform: translate(-2%,1%); } 66% { transform: translate(1%,-2%); } 100% { transform: translate(0,0); } }
  @media (prefers-reduced-motion: reduce) { [aria-hidden="true"] > span { animation: none !important; } }
  @keyframes ambientB { 0% { transform: translate(10vw,12vh) scale(1.15); opacity: 0.18; } 30% { transform: translate(-8vw,-6vh) scale(0.95); opacity: 0.12; } 60% { transform: translate(-14vw,8vh) scale(1.25); opacity: 0.19; } 100% { transform: translate(10vw,12vh) scale(1.15); opacity: 0.18; } }

  /* ---- responsive: phones/tablets only (desktop untouched) ---- */
  @media (max-width: 840px) {
    [data-mq="split"] { grid-template-columns: 1fr !important; }
    [data-mq="split"] > a { border-right: none !important; padding-left: 0 !important; padding-right: 0 !important; }

    [data-mq="films"] { grid-template-columns: repeat(2, 1fr) !important; }
    [data-mq="resume-body"] { grid-template-columns: 1fr !important; }
    [data-mq="hero-row"] { flex-wrap: wrap !important; gap: 1.2rem !important; }

  @media (max-width: 840px) {
    [data-mq="nav"] { gap: 1.1rem !important; }
    [data-mq="nav"] > a { padding: 0.75rem 0.5rem !important; }

    [data-mq="bucket-win"] { overflow: auto !important; max-height: 92dvh !important; }
    [data-mq="bucket-grid"] { flex: none !important; grid-template-rows: repeat(34, 24px) !important; }
    [data-mq="papers-grid"] { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
    [data-mq="win"] { max-height: 92dvh !important; }
  }
  @media (max-width: 600px) { html { font-size: 17px; } }
  /* ---- phone polish: stacked project cards, GIF autoplay, full-width overlays, safe-area, no iOS zoom ---- */
  @media (max-width: 840px) {
    /* project skill logos: side column -> horizontal row under the text (matches the reference on phones) */
    [data-mq="skills"] { flex-direction: row !important; flex-wrap: wrap !important; align-items: center !important; justify-content: flex-start !important; gap: 0.7rem !important; padding-top: 0.2rem !important; }

    /* Decalogy squares: 2-up gets tall; 3-up keeps them square-ish */
    [data-mq="films"] { grid-template-columns: repeat(3, 1fr) !important; }
    /* Paper / résumé fullscreen: use the whole width, leave room for the close ✕ */
    [data-mq="fullview"] { padding: 3rem 0.6rem 1rem !important; }
    [data-mq="fullview"] > div { width: 100% !important; }
    /* Featured film caption breathes on narrow screens */
    [data-mq="feature-cap"] { letter-spacing: 0.18em !important; padding: 0 1rem !important; text-align: center !important; }
    /* Bottom-of-page footer padding respects the home indicator */
    footer { padding-bottom: calc(1.4rem + env(safe-area-inset-bottom)) !important; }
  }
  @media (hover: none) {
    /* Quant project GIFs: no hover on touch, so show the live capture instead of the static line art */
    [data-mq="proj-art"] { opacity: 0 !important; }
    /* skill logos/boxes: rest in the brighter blue since there's no hover to reveal it */

    [data-mq="skills"] [data-box] { color: #a9c0ff !important; border-color: rgba(169,192,255,0.5) !important; }

  @media (max-width: 420px) {
    /* Decalogy: 2-up on the smallest phones so the lock + title stay readable */

  /* ---- touch devices: no hover, so reveal hover-only controls and widen hit areas ---- */
  @media (hover: none) {
    * { -webkit-tap-highlight-color: transparent; }
    [data-mq="dl"] { opacity: 1 !important; transform: none !important; }

  }
  /* ---- large TVs: gently scale everything up ---- */
  @media (min-width: 2200px) { html { font-size: 19px; } }

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pdfHover: false, pdfSrc: "", fullOpen: false };

  componentDidMount() {
    this._escClose = (e) => {
      if (e.key === "Escape" && this.state.fullOpen) this.setState({ fullOpen: false });
    };
    window.addEventListener("keydown", this._escClose);
    // resume.pdf page 1 is rendered live via pdf.js; the download button serves the PDF.
    const renderPdf = () => {
      if (typeof pdfjsLib === "undefined") { setTimeout(renderPdf, 200); return; }
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      pdfjsLib.getDocument("David%20Colindres%20-%20Resume.pdf").promise
        .then((pdf) => pdf.getPage(1))
        .then((page) => {
          const vp = page.getViewport({ scale: 2.4 });
          const c = document.createElement("canvas");
          c.width = vp.width; c.height = vp.height;
          return page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise.then(() => c);
        })
        .then((c) => this.setState({ resumeSrc: c.toDataURL("image/png") }))
        .catch(() => {});
    };
    renderPdf();
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const arm = () => {
      const els = document.querySelectorAll('[data-reveal]:not([data-revealed])');
      if (!els.length) return;
      els.forEach(el => {
        el.dataset.revealed = "armed";
        if (reduced) return;
        el.style.opacity = "0";
        el.style.transform = "translateY(28px)";
        el.style.transition = "opacity 0.9s ease, transform 0.9s ease";
        this._revealObs.observe(el);
      });
    };
    this._revealObs = new IntersectionObserver((entries) => {
      this._ioLive = true;
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.style.opacity = "1";
          e.target.style.transform = "translateY(0)";
          this._revealObs.unobserve(e.target);
        }
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -6% 0px" });
    arm();
    let tries = 0;
    this._revealT = setInterval(() => { arm(); if (++tries > 10) clearInterval(this._revealT); }, 300);
    this._revealSafety = setTimeout(() => {
      if (this._ioLive) return;
      document.querySelectorAll('[data-reveal][data-revealed]').forEach(el => {
        el.style.opacity = "1"; el.style.transform = "translateY(0)";
      });
    }, 2000);
  }

  componentDidUpdate() {
    document.body.style.overflow = this.state.fullOpen ? "hidden" : "";
  }



  componentWillUnmount() {
    if (this._escClose) window.removeEventListener("keydown", this._escClose);
    document.body.style.overflow = "";
    if (this._revealObs) this._revealObs.disconnect();
    if (this._revealT) clearInterval(this._revealT);
    if (this._revealSafety) clearTimeout(this._revealSafety);
  }

  componentDidUpdate() {
    const src = this.state.resumeSrc;
    if (!src) return;
    for (const id of ["resumeImg", "resumeImgFull"]) {
      const el = document.getElementById(id);
      if (el && el.src !== src) el.src = src;
    }
    if (!this.state.resumeShown) {
      const img = document.getElementById("resumeImg");
      if (img) img.decode().catch(() => {}).then(() => requestAnimationFrame(() => this.setState({ resumeShown: true })));
    }
  }
  renderVals() {
    return {
      pdfSrc: this.state.pdfSrc,
      fullOpen: this.state.fullOpen,
      openFull: () => this.setState({ fullOpen: true }),
      closeFull: (e) => { if (e) e.stopPropagation(); this.setState({ fullOpen: false }); },
      resumeReady: !!this.state.resumeSrc,
      resumeOpacity: this.state.resumeShown ? 1 : 0,
      enterPdf: () => this.setState({ pdfHover: true }),
      leavePdf: () => this.setState({ pdfHover: false }),
      dlOpacity: this.state.pdfHover ? 1 : 0,
      dlShift: this.state.pdfHover ? "0" : "6px",
      glance: [
        { k: "Location", v: "Edmond, OK" },
