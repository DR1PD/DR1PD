<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&family=Public+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #05070d; }
  body {
    -webkit-font-smoothing: antialiased;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'><circle cx='11' cy='11' r='9' fill='none' stroke='%23aebfe8' stroke-width='1.2'/><ellipse cx='11' cy='11' rx='4' ry='9' fill='none' stroke='%23aebfe8' stroke-width='0.8'/><path d='M2.6 8 h16.8 M2.6 14 h16.8' stroke='%23aebfe8' stroke-width='0.8' fill='none'/></svg>") 11 11, auto;
  }
  a, button, [role="button"] {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'><circle cx='11' cy='11' r='9' fill='none' stroke='%238fb0ff' stroke-width='1.4'/><ellipse cx='11' cy='11' rx='4' ry='9' fill='none' stroke='%238fb0ff' stroke-width='0.9'/><path d='M2.6 8 h16.8 M2.6 14 h16.8' stroke='%238fb0ff' stroke-width='0.9' fill='none'/></svg>") 11 11, pointer;
  }
  ::selection { background: rgba(143,176,255,0.28); }
  a { color: #e9edf7; }
  a:hover { color: #8fb0ff; }
  @keyframes ambientA { 0% { transform: translate(-12vw,-8vh) scale(1); opacity: 0.14; } 25% { transform: translate(6vw,14vh) scale(1.2); opacity: 0.21; } 50% { transform: translate(16vw,-4vh) scale(1.3); opacity: 0.17; } 75% { transform: translate(-4vw,10vh) scale(1.1); opacity: 0.22; } 100% { transform: translate(-12vw,-8vh) scale(1); opacity: 0.14; } }
  @keyframes ambientB { 0% { transform: translate(10vw,12vh) scale(1.15); opacity: 0.18; } 30% { transform: translate(-8vw,-6vh) scale(0.95); opacity: 0.12; } 60% { transform: translate(-14vw,8vh) scale(1.25); opacity: 0.19; } 100% { transform: translate(10vw,12vh) scale(1.15); opacity: 0.18; } }

  /* ---- responsive: phones/tablets only (desktop untouched) ---- */
  @media (max-width: 840px) {
    [data-mq="split"] { grid-template-columns: 1fr !important; }
    [data-mq="split"] > a { border-right: none !important; padding-left: 0 !important; padding-right: 0 !important; }
    [data-mq="stats"] { display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 0.7rem 2rem !important; }
    [data-mq="world"] { grid-template-columns: 1fr !important; }
    [data-mq="proj"] { grid-template-columns: 1fr !important; gap: 1.1rem !important; }
    [data-mq="proj"] > div:first-child { max-width: 420px; }
    [data-mq="films"] { grid-template-columns: repeat(2, 1fr) !important; }
    [data-mq="resume-body"] { grid-template-columns: 1fr !important; }
    [data-mq="hero-row"] { flex-wrap: wrap !important; gap: 1.2rem !important; }
  }
  /* ---- large TVs: gently scale everything up ---- */
  @media (min-width: 2200px) { html { font-size: 19px; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</helmet>

<div style="min-height:100vh; background:#05070d; color:#e9edf7; font-family:'Public Sans',system-ui,sans-serif; font-weight:300; line-height:1.65;">

  <!-- ambient drifting glow -->
  <div aria-hidden="true" style="position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;">
    <span style="position:absolute; top:8%; left:18%; width:55vw; height:55vw; background:radial-gradient(circle at center, rgba(110,140,255,0.5), transparent 65%); filter:blur(70px); animation:ambientA 52s ease-in-out infinite;"></span>
    <span style="position:absolute; bottom:5%; right:12%; width:48vw; height:48vw; background:radial-gradient(circle at center, rgba(140,110,255,0.4), transparent 65%); filter:blur(70px); animation:ambientB 64s ease-in-out infinite;"></span>
  </div>

  <!-- Nav -->
  <header style="position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:1.1rem clamp(1.25rem,4vw,3rem); background:rgba(5,7,13,0.72); backdrop-filter:blur(12px); border-bottom:1px solid rgba(136,160,220,0.10);">
    <a href="/" style="font-family:'Cormorant Garamond',serif; font-size:1.2rem; font-weight:500; letter-spacing:0.18em; text-decoration:none; color:#e9edf7; font-variant-numeric:lining-nums;">DR1PD</a>
    <nav style="display:flex; gap:2rem; align-items:center;">
      <a href="/q/" style="font-family:'IBM Plex Mono',monospace; font-size:0.66rem; letter-spacing:0.18em; text-transform:uppercase; color:#93a0bf; text-decoration:none;" style-hover="color:#e9edf7;">Quant</a>
      <a href="/c/" style="font-family:'IBM Plex Mono',monospace; font-size:0.66rem; letter-spacing:0.18em; text-transform:uppercase; color:#93a0bf; text-decoration:none;" style-hover="color:#e9edf7;">Create</a>
      <a href="/r/" style="font-family:'IBM Plex Mono',monospace; font-size:0.66rem; letter-spacing:0.18em; text-transform:uppercase; color:#8fb0ff; text-decoration:none; border:1px solid #8fb0ff; border-radius:2px; padding:0.45rem 1rem;">Résumé</a>
    </nav>
  </header>

  <!-- Hero -->
  <section data-screen-label="Resume hero" style="padding:9rem clamp(1.25rem,4vw,3rem) 2.5rem;">
    <div style="max-width:1020px; margin:0 auto;">
      <h1 style="margin:0 0 1rem; font-family:'Cormorant Garamond',serif; font-weight:400; font-size:clamp(3rem,7vw,4.8rem); line-height:1; color:#e9edf7;">Résumé</h1>
      <p style="margin:0; max-width:34rem; color:#93a0bf; font-size:0.95rem;">All in one.</p>
    </div>
  </section>

  <!-- PDF + sidebar -->
  <section data-screen-label="Resume body" style="padding:1rem clamp(1.25rem,4vw,3rem) 6rem;">
    <div data-mq="resume-body" style="max-width:1020px; margin:0 auto; display:grid; grid-template-columns:1fr 300px; gap:2rem; align-items:stretch;">

      <!-- PDF embed; drop resume.pdf next to the files -->
      <div onMouseEnter="{{ enterPdf }}" onMouseLeave="{{ leavePdf }}" style="border:1px solid rgba(136,160,220,0.15); background:#0a0f1b; position:relative; transition:border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;" style-hover="border-color:#8fb0ff; box-shadow:0 0 24px rgba(143,176,255,0.12);">
        <div data-reveal="true" id="resumeFrame" onClick="{{ openFull }}" role="button" aria-label="Expand résumé" style="width:100%; padding:1rem; box-sizing:border-box; background:#0a0f1b; cursor:zoom-in;">
          <div style="min-height:400px;">
            <sc-if value="{{ resumeReady }}" hint-placeholder-val="{{ false }}">
              <img id="resumeImg" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Résumé — David Colindres" style="display:block; width:100%; height:auto; opacity:{{ resumeOpacity }}; transition:opacity 0.8s ease;">
            </sc-if>
          </div>
        </div>
        <a href="/resume.pdf" download="David Colindres' Resume.pdf" aria-label="Download PDF" style="position:absolute; right:1.1rem; bottom:1.1rem; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(136,160,220,0.35); border-radius:50%; background:rgba(5,7,13,0.85); backdrop-filter:blur(6px); opacity:{{ dlOpacity }}; transform:translateY({{ dlShift }}); transition:opacity 0.3s ease, transform 0.3s ease, border-color 0.25s ease;" style-hover="border-color:#8fb0ff;">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 V10 M4.5 6.8 L8 10.3 L11.5 6.8 M2.5 13.5 h11" fill="none" stroke="#8fb0ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
      </div>

      <!-- Fullscreen viewer -->
      <sc-if value="{{ fullOpen }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ closeFull }}" style="position:fixed; inset:0; z-index:400; background:rgba(5,7,13,0.94); backdrop-filter:blur(8px); display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:3.5rem 1.5rem 2rem; box-sizing:border-box; cursor:zoom-out;">
          <img id="resumeImgFull" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Résumé — David Colindres (full screen)" style="display:block; width:min(880px, 100%); height:auto; opacity:{{ resumeOpacity }}; transition:opacity 0.8s ease; box-shadow:0 0 80px rgba(110,140,255,0.15);">
          <span onClick="{{ closeFull }}" role="button" aria-label="Close" style="position:fixed; top:0.55rem; right:0.7rem; font-family:'IBM Plex Mono',monospace; font-size:0.9rem; color:#5c6885; cursor:pointer; padding:0.2rem 0.4rem; transition:color 0.2s ease;" style-hover="color:#e9edf7;">✕</span>
        </div>
      </sc-if>

      <!-- Sidebar -->
      <aside style="display:flex; flex-direction:column; gap:1.4rem;">
        <div style="border:1px solid rgba(136,160,220,0.15); background:#0a0f1b; padding:1.5rem; transition:border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;" style-hover="border-color:#8fb0ff; box-shadow:0 0 24px rgba(143,176,255,0.12);">
          <span style="display:block; font-family:'IBM Plex Mono',monospace; font-size:0.6rem; letter-spacing:0.26em; text-transform:uppercase; color:#5c6885; margin-bottom:1rem;">Profile</span>
          <sc-for list="{{ glance }}" as="g" hint-placeholder-count="4">
            <div style="display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding:0.5rem 0; border-bottom:1px solid rgba(136,160,220,0.08);">
              <span style="font-family:'IBM Plex Mono',monospace; font-size:0.56rem; letter-spacing:0.14em; text-transform:uppercase; color:#5c6885;">{{ g.k }}</span>
              <span style="font-size:0.8rem; color:#e9edf7; text-align:right; white-space:nowrap;">{{ g.v }}</span>
            </div>
          </sc-for>
        </div>

        <div style="border:1px solid rgba(136,160,220,0.15); background:#0a0f1b; padding:2rem 1.5rem 2.2rem; flex:1; display:flex; flex-direction:column; transition:border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;" style-hover="border-color:#8fb0ff; box-shadow:0 0 24px rgba(143,176,255,0.12);">
          <span style="display:block; font-family:'IBM Plex Mono',monospace; font-size:0.6rem; letter-spacing:0.26em; text-transform:uppercase; color:#5c6885; margin-bottom:1.2rem;">Certifications</span>
          <div style="display:flex; flex-direction:column; gap:0.6rem;">
            <sc-for list="{{ certs }}" as="c" hint-placeholder-count="5">
              <span style="font-family:'IBM Plex Mono',monospace; font-size:0.56rem; letter-spacing:0.14em; text-transform:uppercase; color:#93a0bf; border:1px solid rgba(136,160,220,0.18); border-radius:2px; padding:0.55rem 0.8rem;">{{ c }}</span>
            </sc-for>
          </div>
          <a href="mailto:d@dr1pd.com" style="display:block; margin-top:auto; padding-top:1.4rem; font-family:'IBM Plex Mono',monospace; font-size:0.6rem; letter-spacing:0.2em; text-transform:lowercase; color:#93a0bf; text-decoration:none; text-align:center;" style-hover="color:#8fb0ff;">d@dr1pd.com</a>
        </div>
      </aside>
    </div>
  </section>

  <!-- Footer -->
  <footer style="border-top:1px solid rgba(136,160,220,0.10); padding:1.6rem clamp(1.25rem,4vw,3rem); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.8rem;">
    <span style="font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.9rem; color:#5c6885; font-variant-numeric:lining-nums;">© 2026 DR1PD</span>
    <div style="display:flex; gap:0.6rem;">
      <a href="https://www.linkedin.com/in/dr1pd/" target="_blank" rel="noopener" aria-label="LinkedIn" style="width:30px; height:30px; display:flex; align-items:center; justify-content:center; text-decoration:none;" style-hover="opacity:1;"><img src="/social-li-sq.png" alt="" style="width:24px; height:24px; opacity:0.7;"></a>
      <a href="https://github.com/dr1pd" target="_blank" rel="noopener" aria-label="GitHub" style="width:30px; height:30px; display:flex; align-items:center; justify-content:center; text-decoration:none;" style-hover="opacity:1;"><img src="/social-gh-sq.png" alt="" style="width:24px; height:24px; opacity:0.7;"></a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pdfHover: false, pdfSrc: "", fullOpen: false };

  componentDidMount() {
    // resume.pdf page 1 is rendered live via pdf.js; the download button serves the PDF.
    const renderPdf = () => {
      if (typeof pdfjsLib === "undefined") { setTimeout(renderPdf, 200); return; }
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      pdfjsLib.getDocument("/resume.pdf").promise
        .then((pdf) => pdf.getPage(1))
        .then((page) => {
          const vp = page.getViewport({ scale: 2.4 });
          const c = document.createElement("canvas");
          c.width = vp.width; c.height = vp.height;
          return page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise.then(() => c);
        })
        .then((c) => this.setState({ resumeSrc: c.toDataURL("image/png") }))
        .catch(() => {});
    };
    renderPdf();
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const arm = () => {
      const els = document.querySelectorAll('[data-reveal]:not([data-revealed])');
      if (!els.length) return;
      els.forEach(el => {
        el.dataset.revealed = "armed";
        if (reduced) return;
        el.style.opacity = "0";
        el.style.transform = "translateY(28px)";
        el.style.transition = "opacity 0.9s ease, transform 0.9s ease";
        this._revealObs.observe(el);
      });
    };
    this._revealObs = new IntersectionObserver((entries) => {
      this._ioLive = true;
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.style.opacity = "1";
          e.target.style.transform = "translateY(0)";
          this._revealObs.unobserve(e.target);
        }
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -6% 0px" });
    arm();
    let tries = 0;
    this._revealT = setInterval(() => { arm(); if (++tries > 10) clearInterval(this._revealT); }, 300);
    this._revealSafety = setTimeout(() => {
      if (this._ioLive) return;
      document.querySelectorAll('[data-reveal][data-revealed]').forEach(el => {
        el.style.opacity = "1"; el.style.transform = "translateY(0)";
      });
    }, 2000);
  }

  componentDidUpdate() {
    document.body.style.overflow = this.state.fullOpen ? "hidden" : "";
  }

  componentWillUnmount() {
    document.body.style.overflow = "";
    if (this._revealObs) this._revealObs.disconnect();
    if (this._revealT) clearInterval(this._revealT);
    if (this._revealSafety) clearTimeout(this._revealSafety);
  }

  componentDidUpdate() {
    const src = this.state.resumeSrc;
    if (!src) return;
    for (const id of ["resumeImg", "resumeImgFull"]) {
      const el = document.getElementById(id);
      if (el && el.src !== src) el.src = src;
    }
    if (!this.state.resumeShown) {
      const img = document.getElementById("resumeImg");
      if (img) img.decode().catch(() => {}).then(() => requestAnimationFrame(() => this.setState({ resumeShown: true })));
    }
  }
  renderVals() {
    return {
      pdfSrc: this.state.pdfSrc,
      fullOpen: this.state.fullOpen,
      openFull: () => this.setState({ fullOpen: true }),
      closeFull: (e) => { if (e) e.stopPropagation(); this.setState({ fullOpen: false }); },
      resumeReady: !!this.state.resumeSrc,
      resumeOpacity: this.state.resumeShown ? 1 : 0,
      enterPdf: () => this.setState({ pdfHover: true }),
      leavePdf: () => this.setState({ pdfHover: false }),
      dlOpacity: this.state.pdfHover ? 1 : 0,
      dlShift: this.state.pdfHover ? "0" : "6px",
      glance: [
        { k: "Location", v: "Edmond, OK" },
        { k: "Education", v: "M.S., ISE + M.A., Econometrics" },
        { k: "GPA", v: "Graduate: 4.00/4.00" },
        { k: "Recent", v: "Federal Reserve · Cloud/SWE" },
        { k: "Target", v: "MFE → Chicago" },
      ],
      certs: ["C++ for Financial Eng. · Baruch", "Options 101 · Akuna Capital", "Bloomberg Market Concepts", "Lean/Six Sigma Green Belt · ICGB", "Engineering Leadership · JHLP"],
    };
  }
}
</script>
</body>
</html>
